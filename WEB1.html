<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Loading...</title></head>
<body>
<script>
fetch('README.md')
  .then(r => r.text())
  .then(md => {
    // Extract code between ```html and ``` from README
    const match = md.match(/```html\n([\s\S]*?)\n```/);
    if (match) {
      document.open();
      document.write(match[1]);
      document.close();
    } else {
      document.body.innerText = 'Error: No HTML code in README';
    }
  })
  .catch(e => document.body.innerText = 'Error loading README');
</script>
</body>
</html>
