<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Loading...</title>
    <style>
        body { margin:0; background:#fff; }
        iframe { width:100%; height:100vh; border:none; }
    </style>
</head>
<body>
    <iframe id="runner" style="display:none"></iframe>
    <script>
        // Fetch the hidden code from README.md
        fetch('README.md')
            .then(res => res.text())
            .then(md => {
                // Extract content between ```html and ``` 
                const match = md.match(/```html([\s\S]*?)```/);
                if (match) {
                    let htmlCode = match[1].trim();
                    // Create a blob and load it into the iframe
                    const blob = new Blob([htmlCode], {type: 'text/html'});
                    const url = URL.createObjectURL(blob);
                    const iframe = document.getElementById('runner');
                    iframe.style.display = 'block';
                    iframe.src = url;
                    URL.revokeObjectURL(url);
                } else {
                    document.body.innerHTML = '<h3>Error: No HTML code block found in README.md</h3>';
                }
            })
            .catch(err => {
                document.body.innerHTML = '<h3>Error loading README.md: ' + err.message + '</h3>';
            });
    </script>
</body>
</html>
