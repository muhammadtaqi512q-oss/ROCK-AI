<!DOCTYPE html>
<html lang="en">
<head>
<style>
    :root {
        --glass: rgba(255, 255, 255, 0.1);
        --gold: #d4af37;
        --navy: #0a192f;
    }
    
    body {
        background: var(--navy);
        color: white;
        font-family: 'Segoe UI', sans-serif;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        margin: 0;
    }
    
    #chat-window {
        flex: 1;
        overflow-y: auto;
        padding: 20px;
    }
    
    .message {
        background: var(--glass);
        padding: 15px;
        margin: 10px 0;
        border-radius: 15px;
        border-left: 4px solid var(--gold);
        backdrop-filter: blur(10px);
    }
    
    #progress-container {
        position: fixed;
        bottom: 80px;
        width: 100%;
        height: 5px;
        background: #333;
    }
    
    #progress-bar {
        height: 100%;
        background: var(--gold);
        width: 0%;
        transition: width 0.3s;
    }
    
    .input-area {
        padding: 20px;
        display: flex;
        gap: 10px;
        background: rgba(0,0,0,0.5);
    }
    
    input {
        flex: 1;
        padding: 15px;
        border-radius: 10px;
        border: 1px solid var(--gold);
        background: transparent;
        color: white;
    }
    
    button {
        padding: 10px 20px;
        background: var(--gold);
        border: none;
        border-radius: 10px;
        cursor: pointer;
        font-weight: bold;
    }
</style>
</head>
<body>

<div id="progress-container">
    <div id="progress-bar"></div>
</div>

<div id="chat-window"></div>

<div class="input-area">
    <input id="user-input" placeholder="Ask anything, Taqi...">
    <button onclick="handleChat()">Send</button>
</div>

<script type="module">
    import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.0.2';

    // Prevent local caching issues with models
    env.allowLocalModels = false;

    const progressBar = document.getElementById('progress-bar');
    const chatWindow = document.getElementById('chat-window');

    // 1. Progress Bar Logic for Transformers.js
    const pipe = await pipeline('text-generation', 'Xenova/gpt2', {
        progress_callback: (progress) => {
            if (progress.status === 'progress') {
                const pct = (progress.loaded / progress.total) * 100;
                progressBar.style.width = `${pct}%`;
            }
        }
    });

    // Hide progress bar once loaded
    progressBar.style.width = '100%';
    setTimeout(() => document.getElementById('progress-container').style.display = 'none', 1000);

    // 2. Chat Functionality
    window.handleChat = async () => {
        const input = document.getElementById('user-input').value;
        if (!input.trim()) return; 

        chatWindow.innerHTML += `<div class="message"><b>You:</b> ${input}</div>`;
        document.getElementById('user-input').value = '';

        let aiMessage = document.createElement('div');
        aiMessage.className = 'message';
        aiMessage.innerHTML = '<b>AI:</b> <i>Processing...</i>';
        chatWindow.appendChild(aiMessage);
        
        chatWindow.scrollTop = chatWindow.scrollHeight;

        try {
            const response = await pipe(input, { max_new_tokens: 50 });
            // Safely extract the generated part avoiding prompt duplication
            const generatedText = response[0].generated_text;
            const cleanResponse = generatedText.substring(input.length).trim();
            aiMessage.innerHTML = `<b>AI:</b> ${cleanResponse || "..."}`;
        } catch (error) {
            console.error(error);
            aiMessage.innerHTML = `<b>AI:</b> <i>Error generating response.</i>`;
        }
        
        chatWindow.scrollTop = chatWindow.scrollHeight;
    };
</script>

</body>
</html>
