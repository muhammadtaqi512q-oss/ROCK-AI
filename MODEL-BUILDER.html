
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MT | AI Builder</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #0d0e12;
      color: #ffffff;
    }

    /* 1. FULLSCREEN VIDEO OVERLAY */
    #video-gate-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #0d0e12;
      z-index: 99999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .video-card {
      position: relative;
      width: 100%;
      max-width: 900px;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), 0 0 20px rgba(255, 215, 0, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    #yt-player {
      width: 100%;
      height: 100%;
    }

    .gate-notice {
      margin-top: 20px;
      font-size: 15px;
      font-weight: 500;
      color: #ffd700;
      letter-spacing: 0.5px;
      text-align: center;
    }

    /* 2. MAIN WEBSITE IFRAME CONTAINER */
    .iframe-container {
      position: relative;
      width: 100%;
      height: 100%;
      background: white;
      overflow: hidden;
      display: none; /* Video complete hone par show hoga */
    }

    iframe#preview-iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* Banner styles */
    .floating-banner {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
      z-index: 1000;
      animation: slideIn 0.3s ease-out;
      display: flex;
      align-items: center;
      will-change: transform, opacity;
    }

    @keyframes slideIn {
      from {
        transform: translateY(100px) translateZ(0);
        opacity: 0;
      }
      to {
        transform: translateY(0) translateZ(0);
        opacity: 1;
      }
    }

    .floating-banner.dismissed {
      animation: slideOut 0.3s ease-out forwards;
    }

    @keyframes slideOut {
      to {
        transform: translateY(100px) translateZ(0);
        opacity: 0;
      }
    }

    .banner-padding {
      padding: 10px 16px;
    }

    .banner-link-wrapper {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      cursor: pointer;
    }

    .banner-logo {
      display: flex;
      align-items: center;
      color: #2d2d2d;
      flex-shrink: 0;
    }

    .banner-logo svg {
      height: 28px;
      width: auto;
    }

    .banner-text-container {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .banner-text {
      margin: 0;
      white-space: nowrap;
    }

    .banner-upper-text {
      color: #151617;
      font-size: 14px;
    }

    .banner-lower-text {
      color: #878c9f;
      font-size: 10px;
    }

    .banner-action-container {
      border-left: 1px solid rgba(45, 47, 53, 0.08);
      display: flex;
      align-items: center;
      gap: 10px;
      align-self: stretch;
    }

    .action-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      background: none;
      border: none;
      color: #999;
      cursor: pointer;
      transition: color 0.2s;
      flex-shrink: 0;
    }

    .action-btn:hover {
      color: #2d2d2d;
    }
  </style>
</head>
<body data-ryu-obtrusive-scrollbars="false">

  <!-- YOUTUBE VIDEO OVERLAY GATE -->
  <div id="video-gate-overlay">
    <div class="video-card">
      <div id="yt-player"></div>
    </div>
    <p class="gate-notice">Website unlock karne ke liye poori video dekhein...</p>
  </div>

  <!-- MAIN WEBSITE CONTENT -->
  <div class="iframe-container" id="main-site-container">
    <iframe
      id="preview-iframe"
       src="https://019f93e6-8b7c-75df-a85f-a5b307d90e9a.arena.site/?embed=true"
      sandbox="allow-scripts allow-same-origin allow-forms allow-modals allow-orientation-lock allow-pointer-lock allow-presentation allow-popups allow-popups-to-escape-sandbox allow-downloads allow-top-navigation-by-user-activation"
      allow="accelerometer; autoplay; camera; encrypted-media; fullscreen; geolocation; gyroscope; microphone; midi; clipboard-read; clipboard-write; usb; vr; xr-spatial-tracking; screen-wake-lock; magnetometer; ambient-light-sensor; battery; gamepad; picture-in-picture; display-capture; bluetooth;"
      referrerpolicy="origin-when-cross-origin"
    ></iframe>
  </div>

  <svg style="display: none">
    <symbol id="icon-flag" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 22V4a1 1 0 0 1 .4-.8A6 6 0 0 1 8 2c3 0 5 2 7.333 2q2 0 3.067-.8A1 1 0 0 1 20 4v10a1 1 0 0 1-.4.8A6 6 0 0 1 16 16c-3 0-5-2-8-2a6 6 0 0 0-4 1.528"/>
    </symbol>
    <symbol id="icon-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18 6 6 18" />
      <path d="m6 6 12 12" />
    </symbol>
  </svg>

  <!-- YOUTUBE IFRAME API SCRIPT -->
  <script>
    var tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    var firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

    var player;
    function onYouTubeIframeAPIReady() {
      player = new YT.Player('yt-player', {
        videoId: '_BDkuxD9UAc',
        playerVars: {
          'controls': 0,      /* Controls hide taki user fast-forward na kar sake */
          'disablekb': 1,      /* Keyboard control disable */
          'modestbranding': 1,
          'rel': 0,
          'enablejsapi': 1
        },
        events: {
          'onStateChange': onPlayerStateChange
        }
      });
    }

    // Event listener: Jab video khatam ho (State = ENDED)
    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.ENDED) {
        // Overlay hide kar do
        document.getElementById('video-gate-overlay').style.display = 'none';
        
        // Website iframe dikhado
        const mainSite = document.getElementById('main-site-container');
        mainSite.style.display = 'block';
        
        const iframe = document.getElementById("preview-iframe");
        if (iframe) iframe.focus();
      }
    }

    // Original Page Scripts
    document.addEventListener("DOMContentLoaded", () => {
      if (!hasStorageKey("code_reported") || !hasStorageKey("survey_completed")) {
        const reportBtn = document.querySelector(".report-content-btn");
        if (reportBtn) reportBtn.style.display = "block";
      }
    });

    function hasStorageKey(key) {
      try {
        return localStorage.getItem(key) !== null;
      } catch (e) {
        return false;
      }
    }

    function onCodePreviewBannerCTAClicked(event) {
      posthog?.capture?.("code_preview_banner_cta_clicked");
    }

    function reportContent(event) {
      event.preventDefault();
      event.stopPropagation();
      if (!posthog || !posthog.capture || !posthog.setPersonProperties || !posthog.displaySurvey) return;

      if (!hasStorageKey("survey_completed")) {
        posthog.setPersonProperties?.({
          last_reported_message_id: MESSAGE_ID,
          last_report_timestamp: Date.now(),
        });
        posthog.displaySurvey?.(REPORT_SURVEY_ID, {
          ignoreConditions: true,
          ignoreDelay: true,
        });
      }
    }

    function dismissBanner(event) {
      event.preventDefault();
      event.stopPropagation();
      posthog?.capture?.("code_preview_banner_dismiss");

      const banner = document.getElementById("floating-banner");
      if (banner) {
        banner.classList.add("dismissed");
        setTimeout(() => banner.remove(), 300);
      }
    }
  </script>

</body>
</html>
