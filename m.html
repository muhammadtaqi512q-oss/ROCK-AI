<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MT | Web Builder</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #fff;
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .king-text {
            font-size: 3rem;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .error {
            color: #ff4d4d;
            font-size: 1.5rem;
        }
    </style>
</head>
<body>

    <div id="status" class="king-text">VERIFYING...</div>

    <script>
        // URL parameters se API key nikalne ka function
        function getQueryParam(param) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(param);
        }

        // API Validation Rules Checklist
        function validateAPI(api) {
            if (!api) return false;
            if (api.length !== 10) return false;
            if (!api.startsWith('mt')) return false;

            const pattern = /^(mt|tm|zf|mh|az|5|12|14|72|786)+$/;
            return pattern.test(api);
        }

        const userAPI = getQueryParam('api');
        const statusDiv = document.getElementById('status');

        async function processSecurity() {
            // Step 1: Pehle initial character pattern filter hoga
            if (validateAPI(userAPI)) {
                try {
                    // Aapke Gist ka direct Raw JSON URL jo backend variables fetch karega
                    const gistRawURL = "https://githubusercontent.com";
                    
                    // Client background mein secure resource pull kar raha hai
                    const response = await fetch(gistRawURL);
                    if (!response.ok) throw new Error("Connection failed");
                    
                    const data = await response.json();
                    const targetIDLink = data.targetIDLink;

                    if (targetIDLink) {
                        // Success state text update
                        statusDiv.textContent = "MUHAMMAD TAQI KING";
                        statusDiv.className = "king-text";

                        // Parent frame message dispatching setup
                        if (window.parent !== window) {
                            window.parent.postMessage({ status: 'success', url: targetIDLink }, '*');
                        }
                    } else {
                        throw new Error("Invalid format");
                    }

                } catch (err) {
                    statusDiv.textContent = "SERVER ERROR ACCESS DENIED";
                    statusDiv.className = "error";
                }
            } else {
                // Sourse-code inspect karne par direct real link kisi ko nzar nahi aayega
                statusDiv.textContent = "INVALID API KEY ACCESS DENIED";
                statusDiv.className = "error";
            }
        }

        // Script initializes instantly on load
        processSecurity();
    </script>
</body>
</html>
